# APIx route basket — config/basket.yaml
#
# The 50 directional city-pairs the index is computed over, and the
# advance-purchase windows each pair is stratified into.
#
# dgca_pax_share is populated from a real DGCA monthly domestic traffic release —
# see db/seeds/dgca/2026-07.csv for the extract and its provenance, and
# docs/data-sources.md for how to load a newer month. They are not estimated,
# interpolated or guessed: an invented weight would propagate into a published
# national statistic. BasketConfig rejects a partially-populated weight vector, so
# this file is all-null until it is all-real (dgca_loader.load_dgca_release enforces
# that on every write).
#
# Routes are directional. DEL-BOM and BOM-DEL are separate observations because
# they are separately priced.

basket_version: "2026.1"
effective_from: 2026-01-01
description: >-
  Initial APIx basket: the 25 highest-traffic Indian domestic city-pairs, taken in
  both directions. Composition is fixed for the basket version; weights are
  attached in Phase 2 from DGCA passenger data.

advance_windows:
  - code: "AP00_03"
    min_days: 0
    max_days: 3
    label: "0-3 days before departure (walk-up)"
  - code: "AP04_07"
    min_days: 4
    max_days: 7
    label: "4-7 days before departure"
  - code: "AP08_14"
    min_days: 8
    max_days: 14
    label: "8-14 days before departure"
  - code: "AP15_21"
    min_days: 15
    max_days: 21
    label: "15-21 days before departure"
  - code: "AP22_30"
    min_days: 22
    max_days: 30
    label: "22-30 days before departure"
  - code: "AP31_60"
    min_days: 31
    max_days: 60
    label: "31-60 days before departure"
  - code: "AP61_90"
    min_days: 61
    max_days: 90
    label: "61-90 days before departure (advance)"

routes:
  - code: "DEL-BOM"
    origin: "DEL"
    dest: "BOM"
    dgca_pax_share: 0.00974581  # DGCA 2026-07 monthly traffic release
    active_from: 2026-01-01
    active_to: null
  - code: "BOM-DEL"
    origin: "BOM"
    dest: "DEL"
