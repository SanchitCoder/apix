# APIx sources — config/sources.yaml
#
# One entry per site or feed APIx may touch, carrying the full compliance position.
# This file is reviewed by a human; the PolicyEngine reads the database that this file
# seeds, and refuses any request it has not cleared.
#
# Rules encoded in SourcesConfig and enforced here:
#   * enabled: true requires tos_verdict: PERMITTED and a legal_basis.
#   * AMBIGUOUS is treated as PROHIBITED until a human resolves it.
#   * NOT_REVIEWED means no one has looked yet. It cannot be collected from.
#
# Every real source below ships disabled with tos_verdict: NOT_REVIEWED. Phase 2 turns
# a source on only after counsel has reviewed its terms and the review is recorded here
# with a date. Nothing is enabled by writing YAML alone.

version: "2026.1"

sources:
  # ---------------------------------------------------------------- fixtures ----
  # The recorded-response source. The only one enabled by default: it makes no network
  # request at all (loopback only — see apix_collector.fixtureserver), so every test
  # and every local run has something legal to read.
  #
  # tos_reviewed_at is ours to renew, unlike every other source below: this is not a
  # licence granted by a third party, it is APIx's own fixture-serving convention, so
  # "review" here means "an APIx maintainer re-affirms the convention still holds" —
  # bump the date whenever it is touched, the same PolicyEngine review-age rule that
  # protects the real sources still applies to it.
  - code: fixture_replay
    display_name: "Recorded fixture replay"
    domain: localhost
    source_type: OFFICIAL
    enabled: true
    policy:
      robots_url: null
      allowed_paths: ["/fixtures/"]
      disallowed_paths: []
      crawl_delay_s: 0.0
      max_requests_per_hour: 100000
      tos_url: "https://example.org/apix/fixtures-licence"
      tos_reviewed_at: 2026-09-04T00:00:00Z
      tos_verdict: PERMITTED
      legal_basis: FIXTURE

