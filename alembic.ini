# Alembic configuration. Migrations are forward-only: never edit an applied revision.
[alembic]
script_location = db/migrations
prepend_sys_path = packages/apix_core/src
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
# The URL is supplied at runtime from APIX_DATABASE_SYNC_URL — see db/migrations/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
