# mypy is run in --strict mode over packages/apix_core (the contract surface).
# The apps are checked in normal mode: they will grow framework glue that does not
# repay strict annotation, while apix_core must stay fully typed.

[mypy]
python_version = 3.12
files = packages/apix_core/src, apps/api/src, apps/collector/src, apps/scheduler/src
mypy_path = packages/apix_core/src:apps/api/src:apps/collector/src:apps/scheduler/src
namespace_packages = True
explicit_package_bases = True
plugins = pydantic.mypy
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
pretty = True

[mypy-apix_core.*]
strict = True
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True
no_implicit_reexport = True

[mypy-apix_api.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-apix_collector.*]
check_untyped_defs = True

[mypy-apix_scheduler.*]
check_untyped_defs = True

# Third-party packages without bundled type information get an
# `ignore_missing_imports` section here as they are actually imported. Sections for
# packages nothing imports yet are left out: warn_unused_configs flags them as noise.

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-statsmodels.*]
ignore_missing_imports = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
